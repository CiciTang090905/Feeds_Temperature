<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds_temperature Sign In</title>
    <link rel="stylesheet" href="styles/account.css">
</head>
<body data-page="signin">
    <main class="container">
        <header>
            <h1>Feeds_temperature</h1>
            <p class="page-tagline">How are your feeds making you feel today?</p>
        </header>
        <section class="card-grid">
            <div class="form-panel">
                <div class="form-stack">
                    <div>
                        <h2>Ready to check your temperature?</h2>
                        <p class="panel-subtitle">Paste your access code to reconnect your stats on this browser.</p>
                    </div>
                    <form id="signin-form" class="form-stack">
                        <div class="field-group">
                            <label class="field-label" for="access-code">Access code</label>
                            <input class="input-underline" id="access-code" type="text" placeholder="Paste your code…" autocomplete="off" spellcheck="false">
                        </div>
                        <label class="remember-row" for="remember-me">
                            <input id="remember-me" type="checkbox" checked>
                            <span>Remember me on this browser</span>
                        </label>
                        <div class="feedback" data-feedback></div>
                        <div class="button-row">
                            <button class="btn-primary" type="submit">Continue</button>
                        </div>
                    </form>
                    <div>
                        Don't have one yet? <a href="create.html">Create a new account</a>
                    </div>
                </div>
            </div>
            <div class="illus-panel">
                <svg class="mood-arc" viewBox="0 0 320 240" aria-hidden="true">
                    <circle cx="44" cy="88" r="24" fill="#c84a4a"></circle>
                    <circle cx="100" cy="58" r="24" fill="#d88a6a"></circle>
                    <circle cx="160" cy="44" r="24" fill="#a8b0ba"></circle>
                    <circle cx="220" cy="58" r="24" fill="#6aa8b0"></circle>
                    <circle cx="276" cy="88" r="24" fill="#2b7a8a"></circle>
                    <g stroke="#1a2028" stroke-width="2.6" stroke-linecap="round" fill="none">
                        <path d="M36 82 h5"></path><path d="M47 82 h5"></path><path d="M34 97 q10 -9 20 0"></path>
                        <path d="M92 52 h5"></path><path d="M103 52 h5"></path><path d="M91 70 q9 -5 18 0"></path>
                        <path d="M152 38 h5"></path><path d="M163 38 h5"></path><path d="M151 56 q9 6 18 0"></path>
                        <path d="M212 52 h5"></path><path d="M223 52 h5"></path><path d="M211 69 q9 9 18 0"></path>
                    </g>
                    <g stroke="#f8f9fa" stroke-width="2.6" stroke-linecap="round" fill="none">
                        <path d="M268 82 h5"></path><path d="M279 82 h5"></path><path d="M266 97 q10 12 20 0"></path>
                    </g>
                    <rect x="36" y="150" width="248" height="16" rx="8" fill="#d8dce0"></rect>
                    <rect x="36" y="150" width="49.6" height="16" rx="8" fill="#c84a4a"></rect>
                    <rect x="85.6" y="150" width="49.6" height="16" fill="#d88a6a"></rect>
                    <rect x="135.2" y="150" width="49.6" height="16" fill="#a8b0ba"></rect>
                    <rect x="184.8" y="150" width="49.6" height="16" fill="#6aa8b0"></rect>
                    <rect x="234.4" y="150" width="49.6" height="16" rx="8" fill="#2b7a8a"></rect>
                    <path d="M160 139 l-8 -10 h16 z" fill="#1a2028"></path>
                </svg>
                <div class="mood-labels">
                    <span>rage</span>
                    <span>steady</span>
                    <span>delight</span>
                </div>
                <p class="illus-copy">Track the emotional weather of your feeds, one scroll at a time.</p>
            </div>
        </section>
    </main>
    <script src="account-ui.js"></script>
</body>
</html>
