<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds_temperature</title>
    <style>
        :root {
            --bg-page: #eef0f2;
            --bg-card: #f8f9fa;
            --bg-button-alt: #dde4e7;
            --text-primary: #1a2028;
            --text-secondary: #4a5560;
            --text-muted: #6b7580;
            --accent: #2b7a8a;
            --accent-fg: #f8f9fa;
            --border: #d8dce0;
            --font-serif: Georgia, "Times New Roman", serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-serif);
            min-width: 360px;
            margin: 0;
            padding: 18px 16px 16px;
            background: var(--bg-page);
            color: var(--text-primary);
        }

        h1 {
            font-size: 18px;
            margin: 0 0 14px;
            letter-spacing: 0.01em;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 1px 0 rgba(26, 32, 40, 0.02);
        }

        .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .value {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
        }

        .meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            line-height: 1.45;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            background: var(--accent);
            color: var(--accent-fg);
            font-weight: 700;
            cursor: pointer;
            font-family: var(--font-serif);
            transition: transform 120ms ease, opacity 120ms ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.secondary {
            background: var(--bg-button-alt);
            color: var(--text-primary);
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        #post-list {
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
            max-height: 220px;
            overflow: auto;
            color: var(--text-primary);
            padding-right: 4px;
        }

        #post-list::-webkit-scrollbar {
            width: 10px;
        }

        #post-list::-webkit-scrollbar-thumb {
            background: #bcc7cd;
            border-radius: 999px;
            border: 2px solid var(--bg-card);
        }

        #post-list::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <h1>Feeds_temperature</h1>

    <div class="card">
        <div class="label">Signed in</div>
        <div class="value" id="account-name">Checking...</div>
        <div class="meta" id="account-meta"></div>
    </div>

    <div class="card">
        <div class="label">Pending locally</div>
        <div class="value" id="capture-count">0</div>
    </div>

    <div class="card">
        <div class="label">Stored in backend</div>
        <div class="value" id="uploaded-count">0</div>
        <div class="meta" id="backend-meta">No backend data yet</div>
    </div>

    <div class="card">
        <div class="label">Sync status</div>
        <div class="value" id="sync-status">Unknown</div>
    </div>

    <div class="actions">
        <button id="refresh-button">Refresh</button>
        <button class="secondary" id="settings-button">Open settings</button>
    </div>

    <div class="card">
        <div class="label">Recent backend posts</div>
        <div id="post-list">Loading...</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
