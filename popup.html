<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds_temperature</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            min-width: 360px;
            margin: 0;
            padding: 16px;
            background: #f4efe6;
            color: #2a241d;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
        }

        .card {
            background: #fffaf3;
            border: 1px solid #d6c7b1;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 12px;
            color: #6f665b;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            font-weight: 700;
        }

        .meta {
            font-size: 12px;
            color: #6f665b;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 10px 14px;
            background: #b4472c;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: rgba(180, 71, 44, 0.12);
            color: #8f331d;
        }

        #post-list {
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
            max-height: 220px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <h1>Feeds_temperature</h1>

    <div class="card">
        <div class="label">Signed in</div>
        <div class="value" id="account-name">Checking...</div>
        <div class="meta" id="account-meta"></div>
    </div>

    <div class="card">
        <div class="label">Pending locally</div>
        <div class="value" id="capture-count">0</div>
    </div>

    <div class="card">
        <div class="label">Stored in backend</div>
        <div class="value" id="uploaded-count">0</div>
        <div class="meta" id="backend-meta">No backend data yet</div>
    </div>

    <div class="card">
        <div class="label">Sync status</div>
        <div class="value" id="sync-status">Unknown</div>
    </div>

    <div class="actions">
        <button id="refresh-button">Refresh</button>
        <button class="secondary" id="settings-button">Open settings</button>
    </div>

    <div class="card">
        <div class="label">Recent backend posts</div>
        <div id="post-list">Loading...</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
