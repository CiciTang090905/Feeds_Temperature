<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds_temperature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            min-width: 360px;
            margin: 0;
            padding: 16px;
            background: #f6f8fb;
            color: #17202a;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d9e1ea;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 12px;
            color: #536471;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 10px 14px;
            background: #1d9bf0;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: #d92d20;
        }

        #post-list {
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
            max-height: 280px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <h1>Feeds_temperature</h1>

    <div class="card">
        <div class="label">Stored posts</div>
        <div class="value" id="capture-count">0</div>
    </div>

    <div class="card">
        <div class="label">Last captured</div>
        <div class="value" id="last-captured">No posts captured yet</div>
    </div>

    <div class="actions">
        <button id="refresh-button">Refresh</button>
        <button id="clear-button" class="secondary">Clear storage</button>
    </div>

    <div class="card">
        <div class="label">Recent posts</div>
        <div id="post-list">Loading...</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
