<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds_temperature Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 680px;
            margin: 0 auto;
            padding: 24px;
            color: #17202a;
        }

        h1 {
            margin-top: 0;
        }

        .card {
            border: 1px solid #d9e1ea;
            border-radius: 12px;
            padding: 16px;
            background: #ffffff;
        }

        p {
            line-height: 1.6;
        }
    </style>

<body>
    <h1>Feeds_temperature</h1>
    <div class="card">
        <p>This extension currently captures visible X posts into <code>chrome.storage.local</code>.</p>
        <p>Captured posts in local storage: <strong id="post-count">0</strong></p>
        <p>Backend sync is not wired yet. This page is reserved for future capture and backend settings.</p>
    </div>
    <script src="options.js"></script>
</body>

</html>
